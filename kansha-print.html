<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンクスカード 印刷ツール｜神宮寺店</title>
<style>
  :root{
    --green:#375623; --green2:#4E7A3A; --green3:#6FA24C;
    --leaf:#DCEBCE; --cream:#F6FAF0; --ink:#23301B; --muted:#7C8B6E;
    --line:#CBD9BC; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","BIZ UDPゴシック",sans-serif;
    color:var(--ink); background:var(--cream); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- コントロールバー（画面のみ） ---- */
  .bar{
    position:sticky;top:0;z-index:10;background:var(--white);
    border-bottom:2px solid var(--green);
    padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    box-shadow:0 4px 14px rgba(55,86,35,.08);
  }
  .bar h1{font-size:17px;margin:0 12px 0 0;color:var(--green);white-space:nowrap}
  .bar h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .btn{font:inherit;font-weight:700;border-radius:11px;padding:10px 16px;cursor:pointer;border:2px solid var(--green)}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.ghost{background:#fff;color:var(--green)}
  .btn:disabled{opacity:.5;cursor:default}
  .file{position:relative;overflow:hidden;display:inline-flex}
  .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);background:#fff}
  label.ctl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .count{margin-left:auto;font-size:13px;color:var(--green2);font-weight:700}
  .hintbar{padding:10px 18px;font-size:12.5px;color:var(--muted);background:#EEF5E6}

  /* ---- 用紙・カード ---- */
  .sheet{padding:18px;display:flex;justify-content:center}
  .page{
    width:190mm;background:var(--white);padding:6mm;
    display:grid;grid-template-columns:1fr 1fr;gap:6mm;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
  }
  .card{
    border:2px dashed var(--green);border-radius:10px;overflow:hidden;
    height:62mm;display:flex;flex-direction:column;background:#fff;break-inside:avoid;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .card .band{background:var(--green);color:#fff;font-weight:700;font-size:12pt;
    padding:2mm 4mm;display:flex;align-items:center;gap:2mm;letter-spacing:.04em;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .card .band svg{flex:0 0 auto}
  .card .in{padding:3mm 4mm;display:flex;flex-direction:column;gap:1.5mm;flex:1;min-height:0}
  .card .to{font-size:12.5pt;font-weight:700}
  .card .to .nm{color:var(--green2);border-bottom:2px solid var(--leaf);padding:0 2px}
  .card .msg{flex:1;font-size:11pt;white-space:pre-wrap;overflow:hidden}
  .card .ft{display:flex;justify-content:space-between;align-items:flex-end}
  .card .ft .date{font-size:8pt;color:#A9B79A}
  .card .ft .from{font-weight:700;color:var(--green);font-size:10.5pt}
  .card .ft .from .nm{border-bottom:2px solid var(--leaf);padding:0 2px}

  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty svg{opacity:.5;margin-bottom:10px}
  .empty b{color:var(--green);display:block;font-size:16px;margin-bottom:4px}

  /* ---- 印刷 ---- */
  @media print{
    @page{size:A4 portrait;margin:8mm}
    .bar,.hintbar{display:none!important}
    .sheet{padding:0}
    .page{width:auto;box-shadow:none;padding:0;gap:5mm}
    .card{height:62mm}
    body{background:#fff}
  }
  @media (max-width:820px){ .page{width:100%} }
</style>
</head>
<body>
  <div class="bar">
    <h1>サンクスカード 印刷ツール<small>神宮寺店</small></h1>
    <span class="file btn primary">CSVを読み込む
      <input type="file" id="csv" accept=".csv,text/csv">
    </span>
    <label class="ctl">並び順
      <select id="sort">
        <option value="to">贈る相手ごと</option>
        <option value="time">提出順</option>
        <option value="from">書いた人ごと</option>
      </select>
    </label>
    <button class="btn ghost" id="printBtn" disabled>印刷する</button>
    <span class="count" id="count"></span>
  </div>
  <div class="hintbar">
    Googleスプレッドシートの「回答」を <b>ファイル → ダウンロード → CSV</b> で保存し、上の「CSVを読み込む」で選択。
    文字コード（UTF-8／Shift_JIS）は自動判定します。太い破線で切り取り、そのまま手渡し／掲示に。
  </div>

  <div class="sheet">
    <div class="page" id="page">
      <div class="empty" style="grid-column:1 / -1">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#375623" stroke-width="1.6"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h6"/></svg>
        <b>CSVを読み込むとカードが並びます</b>
        列：タイムスタンプ／贈る相手／メッセージ／書いた人
      </div>
    </div>
  </div>

<script>
/* ---------- CSV 読み込み（文字コード自動判定＋BOM対応） ---------- */
document.getElementById('csv').addEventListener('change', async (e)=>{
  const f=e.target.files[0]; if(!f) return;
  const buf=await f.arrayBuffer();
  let bytes=new Uint8Array(buf);
  let text;
  try { text=new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(err){ try{ text=new TextDecoder('shift_jis').decode(bytes); }catch(e2){ text=new TextDecoder('utf-8').decode(bytes);} }
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // BOM除去
  render(parseCSV(text));
});

/* ---------- CSVパーサ（引用符・カンマ・改行対応） ---------- */
function parseCSV(text){
  const rows=[]; let row=[]; let cur=''; let q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>v && v.trim()!==''));
}

/* ---------- 列の割り当て（見出し検出＋フォールバック） ---------- */
function mapColumns(rows){
  const head=rows[0].map(h=>(h||'').trim());
  const find=(...keys)=>{ for(let i=0;i<head.length;i++){ if(keys.some(k=>head[i].includes(k))) return i; } return -1; };
  let iTo=find('相手','贈'), iMsg=find('内容','メッセージ','ありがとう','本文'), iFrom=find('書いた','記名','差出','from','From');
  let iTime=find('タイムスタンプ','日時','日付','時刻','Timestamp');
  const hasHeader = (iTo>=0||iMsg>=0||iFrom>=0);
  if(!hasHeader){ iTime=0; iTo=1; iMsg=2; iFrom=3; }
  else { if(iTo<0)iTo=1; if(iMsg<0)iMsg=2; if(iFrom<0)iFrom=3; if(iTime<0)iTime=0; }
  const data = hasHeader ? rows.slice(1) : rows;
  return {iTime,iTo,iMsg,iFrom,data};
}

/* ---------- 描画 ---------- */
let CARDS=[];
function render(rows){
  if(!rows.length){ return; }
  const {iTime,iTo,iMsg,iFrom,data}=mapColumns(rows);
  CARDS=data.map(r=>({
    to:(r[iTo]||'').trim(),
    msg:(r[iMsg]||'').trim(),
    from:(r[iFrom]||'').trim(),
    time:(r[iTime]||'').trim()
  })).filter(c=>c.to||c.msg);
  paint();
}
function paint(){
  const sortBy=document.getElementById('sort').value;
  let list=CARDS.slice();
  if(sortBy==='to') list.sort((a,b)=>a.to.localeCompare(b.to,'ja')|| a.time.localeCompare(b.time));
  else if(sortBy==='from') list.sort((a,b)=>a.from.localeCompare(b.from,'ja'));
  // 'time' はそのまま（提出順）

  const page=document.getElementById('page');
  page.innerHTML='';
  if(!list.length){ page.innerHTML='<div class="empty" style="grid-column:1 / -1"><b>データがありません</b>CSVの中身をご確認ください</div>'; return; }
  const heart='<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.7-9C.7 8.6 2.4 5 6 5c2 0 3.2 1.1 4 2.3C10.8 6.1 12 5 14 5c3.6 0 5.3 3.6 3.7 7-2.2 4.4-9.7 9-9.7 9z"/></svg>';
  list.forEach(c=>{
    const el=document.createElement('div'); el.className='card';
    const date = c.time ? c.time.split(' ')[0].replace(/\//g,'/') : '';
    el.innerHTML=
      '<div class="band">'+heart+'サンクスカード</div>'+
      '<div class="in">'+
        '<div class="to"><span class="nm">'+esc(c.to||'　')+'</span> さんへ</div>'+
        '<div class="msg">'+esc(c.msg)+'</div>'+
        '<div class="ft"><span class="date">'+esc(date)+'</span>'+
          '<span class="from">from <span class="nm">'+esc(c.from||'　')+'</span></span></div>'+
      '</div>';
    page.appendChild(el);
  });
  document.getElementById('count').textContent='カード '+list.length+'枚';
  document.getElementById('printBtn').disabled=false;
}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

document.getElementById('sort').addEventListener('change',paint);
document.getElementById('printBtn').addEventListener('click',()=>window.print());
</script>
</body>
</html>
